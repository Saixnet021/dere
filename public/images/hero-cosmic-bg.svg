<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" fill="none">
  <!-- Deep Space Dark Canvas -->
  <rect width="1440" height="640" fill="#070B08" />

  <!-- Subtle Perspective Grid (Cyber / Space Theme) -->
  <g opacity="0.08" stroke="#22C55E" stroke-width="0.75">
    <!-- Vertical Perspective Lines -->
    <line x1="720" y1="0" x2="0" y2="640" />
    <line x1="720" y1="0" x2="180" y2="640" />
    <line x1="720" y1="0" x2="360" y2="640" />
    <line x1="720" y1="0" x2="540" y2="640" />
    <line x1="720" y1="0" x2="720" y2="640" />
    <line x1="720" y1="0" x2="900" y2="640" />
    <line x1="720" y1="0" x2="1080" y2="640" />
    <line x1="720" y1="0" x2="1260" y2="640" />
    <line x1="720" y1="0" x2="1440" y2="640" />
    
    <!-- Horizontal Grid Lines -->
    <line x1="0" y1="400" x2="1440" y2="400" />
    <line x1="0" y1="470" x2="1440" y2="470" />
    <line x1="0" y1="530" x2="1440" y2="530" />
    <line x1="0" y1="580" x2="1440" y2="580" />
    <line x1="0" y1="615" x2="1440" y2="615" />
  </g>

  <!-- Distant Stars & Cosmic Dust (Solid White & Emerald Circles) -->
  <g opacity="0.45">
    <circle cx="120" cy="80" r="1.5" fill="#FFFFFF" />
    <circle cx="280" cy="140" r="1" fill="#4ADE80" />
    <circle cx="450" cy="60" r="1.2" fill="#FFFFFF" />
    <circle cx="620" cy="110" r="1" fill="#22C55E" />
    <circle cx="890" cy="70" r="1.5" fill="#FFFFFF" />
    <circle cx="1040" cy="130" r="1" fill="#4ADE80" />
    <circle cx="1280" cy="95" r="1.8" fill="#FFFFFF" />
    <circle cx="1380" cy="180" r="1" fill="#22C55E" />
    <circle cx="80" cy="280" r="1.2" fill="#FFFFFF" />
    <circle cx="1340" cy="340" r="1.4" fill="#FFFFFF" />
  </g>

  <!-- Fine Line Constellations / Geometric 420 Accents -->
  <g opacity="0.15" stroke="#22C55E" stroke-width="0.8">
    <!-- Left Geometric Constellation -->
    <polyline points="90,140 140,110 180,160 220,130" fill="none" />
    <circle cx="90" cy="140" r="2.5" fill="#22C55E" />
    <circle cx="140" cy="110" r="2.5" fill="#22C55E" />
    <circle cx="180" cy="160" r="2.5" fill="#22C55E" />
    <circle cx="220" cy="130" r="2.5" fill="#22C55E" />

    <!-- Right Geometric Constellation -->
    <polyline points="1260,110 1310,80 1370,120 1410,90" fill="none" />
    <circle cx="1260" cy="110" r="2.5" fill="#22C55E" />
    <circle cx="1310" cy="80" r="2.5" fill="#22C55E" />
    <circle cx="1370" cy="120" r="2.5" fill="#22C55E" />
    <circle cx="1410" cy="90" r="2.5" fill="#22C55E" />
  </g>
</svg>
