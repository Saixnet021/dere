<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <!-- Minimalist Clean Hero Composition (NO GRADIENTS) -->
  <rect width="600" height="450" fill="#FFFFFF"/>
  <rect x="20" y="20" width="560" height="410" rx="8" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Subtle Background Geometry -->
  <circle cx="300" cy="225" r="140" stroke="#F3F4F6" stroke-width="1.5" fill="#FBFDFB"/>
  <circle cx="300" cy="225" r="90" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 4" fill="none"/>
  
  <g stroke="#2D5A3D" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center: Elegant Beaker Bong Outline -->
    <path d="M285 110 L315 110 L315 220 L365 300 C370 310 360 320 350 320 L250 320 C240 320 230 310 235 300 L285 220 Z" fill="#FFFFFF"/>
    <rect x="280" y="105" width="40" height="7" rx="3.5" fill="#2D5A3D" stroke="none"/>
    <line x1="325" y1="240" x2="355" y2="205" stroke="#2D5A3D" stroke-width="2"/>
    <circle cx="360" cy="200" r="9" fill="#FFFFFF" stroke="#2D5A3D"/>
    
    <!-- Left: Grinder Component -->
    <rect x="130" y="240" width="80" height="20" rx="4" fill="#1F2937" stroke="#111827"/>
    <rect x="130" y="263" width="80" height="24" fill="#374151" stroke="#111827"/>
    <rect x="130" y="290" width="80" height="20" rx="4" fill="#1F2937" stroke="#111827"/>
    <circle cx="170" cy="250" r="3" fill="#2D5A3D"/>
    <text x="170" y="330" font-family="sans-serif" font-size="8" font-weight="700" letter-spacing="1" fill="#4B5563" text-anchor="middle" stroke="none">PRECISION</text>
    
    <!-- Right: Glass Pipe & Papers -->
    <path d="M410 250 C410 235 430 230 445 240 L500 245 C508 245 510 250 510 253 C510 256 508 260 500 260 L445 265 C430 275 410 270 410 250 Z" fill="#FFFFFF"/>
    <ellipse cx="428" cy="248" rx="10" ry="8" fill="#F4F8F5" stroke="#2D5A3D"/>
    
    <!-- Raw paper booklet under pipe -->
    <rect x="420" y="285" width="90" height="35" rx="3" fill="#F9FAFB" stroke="#2D5A3D"/>
    <text x="465" y="307" font-family="sans-serif" font-size="9" font-weight="800" letter-spacing="1" fill="#2D5A3D" text-anchor="middle" stroke="none">RAW BLACK</text>
    
    <!-- Fine botanical accent lines -->
    <path d="M300 365 C295 355 295 345 300 335 C305 345 305 355 300 365 Z" fill="#4A7C59" stroke="none"/>
  </g>
  
  <!-- Subtle minimalist badge -->
  <rect x="235" y="375" width="130" height="24" rx="12" fill="#F4F8F5" stroke="#D1D5DB" stroke-width="1"/>
  <text x="300" y="391" font-family="sans-serif" font-size="9" font-weight="600" letter-spacing="1.5" fill="#2D5A3D" text-anchor="middle">100% DISCRETO &amp; SEGURO</text>
</svg>
